name: NOMAD RP - Dubai Pawn Compile Check

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'server-dubai/**'
      - '.github/workflows/pawn-compile.yml'

jobs:
  compile:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server-dubai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate 7-Zip
        shell: pwsh
        run: |
          $sevenZip = @(
            'C:\Program Files\7-Zip\7z.exe',
            'C:\Program Files (x86)\7-Zip\7z.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sevenZip) {
            throw '7-Zip was not found on the Windows runner.'
          }
          "SEVENZIP=$sevenZip" >> $env:GITHUB_ENV

      - name: Extract Pawn include archive
        shell: pwsh
        run: |
