name: NOMAD RP - Dubai Pawn Compile Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'server-dubai/**'
      - '.github/workflows/pawn-compile.yml'

jobs:
  compile:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server-dubai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate 7-Zip
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )
          $sevenZip = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $sevenZip) {
            $command = Get-Command 7z.exe -ErrorAction SilentlyContinue
            if ($command) { $sevenZip = $command.Source }
          }
          if (-not $sevenZip) {
            choco install 7zip.install --no-progress -y
            $candidates = @(
              "$env:ProgramFiles\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
            )
            $sevenZip = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $sevenZip) {
            throw '7-Zip could not be located or installed.'
          }
          "SEVENZIP=$sevenZip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract Pawn include archive
        shell: pwsh
        run: |
          $archive = 'pawno/include.rar'
          if (!(Test-Path $archive)) {
            throw 'pawno/include.rar not found. Confirm the complete Dubai RP project is in server-dubai.'
          }
          $extractRoot = 'pawno/_include_extract'
          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          & $env:SEVENZIP x $archive "-o$extractRoot" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Could not extract pawno/include.rar (exit code $LASTEXITCODE)."
          }
          $openMpFile = Get-ChildItem -Path $extractRoot -Filter 'open.mp.inc' -File -Recurse | Select-Object -First 1
          if (-not $openMpFile) {
            throw 'open.mp.inc was not found inside pawno/include.rar.'
          }
          $includeSource = $openMpFile.Directory.FullName
          New-Item -ItemType Directory -Force -Path 'pawno/include' | Out-Null
          Copy-Item -Path (Join-Path $includeSource '*') -Destination 'pawno/include' -Recurse -Force
          if (!(Test-Path 'pawno/include/open.mp.inc')) {
            throw 'pawno/include/open.mp.inc is missing after extraction.'
          }
          Remove-Item $extractRoot -Recurse -Force

      - name: Compile Dubai-V2 gamemode
        shell: pwsh
        run: |
          $compiler = 'pawno/pawncc.exe'
          $source = 'gamemodes/Dubai-V2.pwn'
          $output = 'gamemodes/Dubai-V2.amx'
          if (!(Test-Path $compiler)) { throw 'pawno/pawncc.exe not found.' }
          if (!(Test-Path $source)) { throw 'gamemodes/Dubai-V2.pwn not found.' }
          & $compiler $source '-ipawno/include' '-igamemodes' "-o$output"
          if ($LASTEXITCODE -ne 0) {
            throw "Pawn compilation failed with exit code $LASTEXITCODE. See compiler output above."
          }
          if (!(Test-Path $output)) {
            throw 'Compiler finished but the AMX output file was not created.'
          }

      - name: Upload compiled AMX artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOMAD-Dubai-RP-AMX
          path: server-dubai/gamemodes/Dubai-V2.amx
          if-no-files-found: error
          retention-days: 7
